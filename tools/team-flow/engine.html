<!doctype html>
<html><head><meta charset="utf-8" />
<title>Team Management workflow (engine, task 7x9o)</title>
<!-- Lane CRISP 2D KINETIC của skill media-business-video: một file = cả clip, mọi phần tử là hàm thuần của t qua window.seek(t).
     Dựng lại: node tools/team-flow/render.mjs   (ra assets/workflow/team-flow-{ja,en,vi}[-m].mp4 + .webp). Xem thử: mở file này, ?lang=en&play=1
     Bố cục: mặc định ngang 16:9 (1600x900); ?layout=m = dọc 3:4 (1200x1600) cho màn hẹp, chữ to đọc được trên điện thoại. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#f4f1fb}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 42%,#fdfcff 0%,#f3effb 58%,#e8e2f6 100%)}
#grid{position:absolute;inset:0;background-image:radial-gradient(#d6cfec 1.3px,transparent 1.5px);background-size:32px 32px;opacity:.5}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.t{font-family:'Manrope','Noto Sans JP',sans-serif;position:absolute}
html[lang="ja"] .t{font-family:'Noto Sans JP','Manrope',sans-serif}
.eb{left:120px;top:84px;font-weight:800;font-size:17px;letter-spacing:.26em;color:#6d5bd0;font-family:'Manrope',sans-serif!important}
.ttl{left:120px;top:114px;font-weight:800;font-size:44px;line-height:1.15;color:#16141d;letter-spacing:-.01em;text-transform:uppercase}
html[lang="ja"] .ttl{font-weight:900;letter-spacing:.02em}
.stp{right:120px;top:86px;text-align:right;font:800 17px 'Manrope',sans-serif!important;letter-spacing:.22em;color:#3b2f86}
.pips{position:absolute;right:120px;top:124px;display:flex;gap:8px}
.pip{width:30px;height:8px;border-radius:4px;background:#dcd5ee;overflow:hidden}
.pip i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6d5bd0,#26B3F4);transform-origin:0 50%}
#flow{position:absolute;left:0;top:0}
.lab{position:absolute;top:520px;width:218px;text-align:center}
.lab .n{display:block;position:static;margin:0 auto;font:800 15px 'Manrope',sans-serif!important;letter-spacing:.2em;color:#6d5bd0;width:max-content}
.lab .h{display:block;position:static;margin:8px auto 0;font-weight:800;font-size:21px;line-height:1.28;text-transform:uppercase;width:max-content;max-width:218px;text-wrap:balance}
html[lang="vi"] .lab .h{font-size:19.5px}
html[lang="ja"] .lab .h{font-weight:700;font-size:23px;letter-spacing:.02em}
.lab .s{display:block;position:static;margin:10px auto 0;font-weight:600;font-size:14.5px;line-height:1.4;color:#6f6987;text-transform:uppercase;width:max-content;max-width:218px;letter-spacing:.03em;text-wrap:balance}
html[lang="ja"] .lab .s{font-weight:500;font-size:15.5px;letter-spacing:.04em}
.res{left:50%;top:760px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:14px 30px;border-radius:999px;
  background:#fff;border:1.5px solid #e2dcf2;box-shadow:0 18px 40px -26px rgba(59,47,134,.55);font-weight:800;font-size:19px;color:#3b2f86;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
html[lang="ja"] .res{letter-spacing:.08em;font-weight:700;font-size:20px}
.res img{flex:none}
/* bố cục dọc cho màn hẹp (?layout=m) */
html.m,html.m body{width:1200px;height:1600px}
html.m .eb{left:80px;top:64px;font-size:26px}
html.m .stp{right:80px;top:64px;font-size:26px!important}
html.m .ttl{left:80px;top:104px;font-size:64px}
html.m .pips{right:auto;left:80px;top:204px;gap:12px}
html.m .pip{width:52px;height:12px;border-radius:6px}
html.m .lab{width:820px;text-align:left;transform:translateY(-50%)}
html.m .lab .n,html.m .lab .h,html.m .lab .s{margin-left:0;max-width:820px}
html.m .lab .n{font-size:24px!important}
html.m .lab .h{font-size:46px;margin-top:6px}
html.m[lang="vi"] .lab .h{font-size:44px}
html.m[lang="ja"] .lab .h{font-size:48px}
html.m .lab .s{font-size:32px;margin-top:6px}
html.m[lang="ja"] .lab .s{font-size:33px}
html.m .res{top:1466px;font-size:28px;padding:20px 36px;gap:16px}
html.m[lang="vi"] .res{font-size:25px}
html.m[lang="ja"] .res{font-size:31px}
html.m .res img{width:44px;height:44px}
</style></head>
<body>
<div id="stage"><div id="grid"></div>
  <div id="cam">
    <svg id="flow" width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true"></svg>
    <div id="labs"></div>
  </div>
  <div class="t eb" data-box="eyebrow">TEAM MANAGEMENT</div>
  <div class="t ttl" data-box="title" id="ttl"></div>
  <div class="t stp" data-box="step" id="stp">STEP 01 / 06</div>
  <div class="pips" id="pips"></div>
  <div class="t res" data-box="result" id="res"></div>
</div>
<script>
// ── Chữ trên clip (3 ngôn ngữ). Nội dung lấy từ chính tab Team Management (6 cách vận hành đội), không thêm số liệu mới.
const LABELS = {
  ja: { title: 'チーム運営のワークフロー', result: '数字で見える化し、人を育てて成果へ',
    steps: [['目標と役割', 'KPI・評価基準'], ['工程の標準化', 'SOP・完了の定義'], ['日々の数字', '時間・タスク・架電'],
      ['原因分析と改善', 'データから次の打ち手'], ['人材の育成', '人事 1名から5名へ'], ['経営への報告', '日次・週次・月次']] },
  en: { title: 'How I run a team', result: 'Visible numbers, growing people, results',
    steps: [['Targets & roles', 'KPI, appraisal'], ['Standard steps', 'SOP, define "done"'], ['Daily numbers', 'Hours, tasks, calls'],
      ['Cause & action', 'Data to next step'], ['Grow people', 'HR team 1 to 5'], ['Report up', 'Daily, weekly, monthly']] },
  vi: { title: 'Cách tôi vận hành đội', result: 'Số liệu rõ ràng, đội ngũ trưởng thành, ra kết quả',
    steps: [['Mục tiêu & vai trò', 'KPI, tiêu chí đánh giá'], ['Chuẩn hóa quy trình', 'SOP, định nghĩa "xong"'], ['Số liệu hằng ngày', 'Giờ làm, task, cuộc gọi'],
      ['Tìm nguyên nhân', 'Từ dữ liệu ra hành động'], ['Phát triển con người', 'Đội nhân sự 1 lên 5'], ['Báo cáo lãnh đạo', 'Ngày, tuần, tháng']] },
};
const Q = new URLSearchParams(location.search);
const LANG = LABELS[Q.get('lang')] ? Q.get('lang') : 'ja';
document.documentElement.lang = LANG;
const L = LABELS[LANG];

// ── Nhịp (giây). Vòng lặp liền: trạng thái lúc DURATION trùng lúc 0.
const DURATION = 4.8, T0 = 0.30, STEP = 0.58, HOLD_END = 4.22, RESET = 0.48;
const MOB = Q.get('layout') === 'm';
if (MOB) document.documentElement.classList.add('m');
const W = MOB ? 1200 : 1600, H = MOB ? 1600 : 900, N = 6, TILE = 156;
// tâm ô: ngang 1 hàng (16:9) hoặc dọc 1 cột (3:4); làn chảy là đoạn thẳng nối tâm ô đầu và ô cuối
const POS = Array.from({ length: N }, (_, i) => MOB ? [160, 340 + 200 * i] : [200 + 240 * i, 392]);
const X = (i) => POS[i][0], Y = (i) => POS[i][1];
const GAP = Math.hypot(X(1) - X(0), Y(1) - Y(0));
const TA = Array.from({ length: N }, (_, i) => T0 + STEP * i);
const RES_IN = TA[N - 1] + 0.42;

// ── Easing / tiện ích thuần
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);            // easeOutCubic
const eio = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const bump = (x) => (x <= 0 || x >= 1) ? 0 : Math.sin(Math.PI * x);
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = (c) => `rgb(${c.join(',')})`;
const fadeOut = (t) => 1 - eio((t - HOLD_END) / RESET);   // 1 tới HOLD_END, về 0 lúc HOLD_END+RESET

// ── Dựng SVG một lần (tĩnh); seek chỉ đổi thuộc tính.
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('flow');
svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };
svg.innerHTML = `<defs>
  <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E9BFF"/><stop offset=".6" stop-color="#8CCBFF"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
  <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="gLane" gradientUnits="userSpaceOnUse" x1="${X(0)}" y1="${Y(0)}" x2="${X(N - 1)}" y2="${Y(N - 1)}"><stop offset="0" stop-color="#2E9BFF"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2E6FC4" flood-opacity=".2"/></filter>
  <filter id="shA" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2E9BFF" flood-opacity=".38"/></filter>
</defs>`;
// làn chảy: nét đứt nền + nét đặc vẽ dần (stroke-dashoffset trên chính nét, không có vật thể bay tự do)
const LANE_LEN = GAP * (N - 1);
el('line', { x1: X(0), y1: Y(0), x2: X(N - 1), y2: Y(N - 1), stroke: '#d6e4f5', 'stroke-width': 4, 'stroke-dasharray': '2 12', 'stroke-linecap': 'round' });
const lane = el('line', { x1: X(0), y1: Y(0), x2: X(N - 1), y2: Y(N - 1), stroke: 'url(#gLane)', 'stroke-width': 6, 'stroke-linecap': 'round',
  'stroke-dasharray': `${LANE_LEN} ${LANE_LEN + 20}`, 'stroke-dashoffset': LANE_LEN });
// chevron chỉ hướng giữa các ô
for (let i = 0; i < N - 1; i++) { const x = (X(i) + X(i + 1)) / 2, y = (Y(i) + Y(i + 1)) / 2; el('path', { d: MOB ? `M${x - 8} ${y - 5} L${x} ${y + 4} L${x + 8} ${y - 5}` : `M${x - 5} ${y - 8} L${x + 4} ${y} L${x - 5} ${y + 8}`, fill: 'none', stroke: '#b9cfea', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'chev' }); }

// Mỗi ô: lớp idle (xám, tĩnh) + lớp active (màu, hoạt hình theo thời gian cục bộ lt = t - TA[i]).
// Icon đặt trong hộp cục bộ 120x120, gốc (cx-60, cy-60).
const NODES = [];
for (let i = 0; i < N; i++) {
  const g = el('g', {});
  const tile = el('g', {}, g);
  el('rect', { x: X(i) - TILE / 2, y: Y(i) - TILE / 2, width: TILE, height: TILE, rx: 32, fill: '#fff', stroke: '#e4def2', 'stroke-width': 2, filter: 'url(#sh)' }, tile);
  const actRect = el('rect', { x: X(i) - TILE / 2, y: Y(i) - TILE / 2, width: TILE, height: TILE, rx: 32, fill: '#fff', stroke: 'url(#gBrand)', 'stroke-width': 3, filter: 'url(#shA)', opacity: 0 }, tile);
  const idle = el('g', { transform: `translate(${X(i) - 60} ${Y(i) - 60})` }, tile);
  const act = el('g', { transform: `translate(${X(i) - 60} ${Y(i) - 60})`, opacity: 0 }, tile);
  NODES.push({ g, tile, actRect, idle, act, parts: {} });
}
const P = (i) => NODES[i].parts;

// Icon 3D kính mờ (task zze2, vẽ bằng ChatGPT, dùng chung assets/icons với trang): lớp chờ = xám mờ, lớp bật = màu + nảy nhẹ.
const ICONS = ['ic-target', 'ic-list', 'ic-trend', 'ic-cause', 'ic-people', 'ic-report'];
const ICON_SRC = (n) => `../../assets/icons/${n}.webp`;
ICONS.forEach((name, i) => { const n = NODES[i];
  el('image', { href: ICON_SRC(name), x: -4, y: -4, width: 128, height: 128, filter: 'url(#gray)', opacity: .45 }, n.idle);
  const pop = el('g', { transform: 'translate(60 60) scale(.7) translate(-60 -60)' }, n.act); P(i).pop = pop;
  el('image', { href: ICON_SRC(name), x: -4, y: -4, width: 128, height: 128 }, pop);
});

// ── Chữ HTML
document.getElementById('ttl').textContent = L.title;
const resEl = document.getElementById('res');
resEl.innerHTML = `<img src="${ICON_SRC('ic-trend')}" width="34" height="34" alt=""><span>${L.result}</span>`;
const labs = document.getElementById('labs'); const LABS = [];
L.steps.forEach(([h, s], i) => {
  const d = document.createElement('div'); d.className = 'lab';
  d.style.left = (MOB ? X(i) + TILE / 2 + 44 : X(i) - 109) + 'px'; d.style.top = (MOB ? Y(i) : Y(i) + TILE / 2 + 50) + 'px';
  d.innerHTML = `<span class="t n" data-box="n${i + 1}">${String(i + 1).padStart(2, '0')}</span><span class="t h" data-box="h${i + 1}"></span><span class="t s" data-box="s${i + 1}"></span>`;
  d.querySelector('.h').textContent = h; d.querySelector('.s').textContent = s;
  labs.appendChild(d); LABS.push(d);
});
const pips = document.getElementById('pips'); const PIPS = [];
for (let i = 0; i < N; i++) { const p = document.createElement('div'); p.className = 'pip'; p.innerHTML = '<i></i>'; pips.appendChild(p); PIPS.push(p.firstChild); }
const cam = document.getElementById('cam'), stp = document.getElementById('stp');

// ── seek(t): hàm thuần của t
const kOf = (i, t) => eo((t - TA[i]) / 0.2) * fadeOut(t);
function seek(t) {
  t = cl(t, 0, DURATION);
  const fo = fadeOut(t);
  // máy quay: chỉ zoom chậm, về 1 khi lặp
  const z = t <= HOLD_END ? 1 + 0.028 * eio(t / HOLD_END) : 1 + 0.028 * (1 - eio((t - HOLD_END) / (DURATION - HOLD_END)));
  cam.style.transform = `scale(${z.toFixed(5)})`;
  // làn chảy tới tâm ô i đúng lúc ô i bật
  let reach = 0;
  for (let i = 1; i < N; i++) reach += GAP * eio((t - (TA[i - 1] + 0.12)) / (TA[i] - TA[i - 1] - 0.12));
  lane.setAttribute('stroke-dashoffset', (LANE_LEN - reach).toFixed(2));
  lane.setAttribute('opacity', fo.toFixed(4));
  let count = 0;
  for (let i = 0; i < N; i++) {
    const n = NODES[i], k = kOf(i, t), lt = t - TA[i], p = n.parts || P(i);
    if (t >= TA[i] && t < HOLD_END) count = i + 1;
    n.act.setAttribute('opacity', k.toFixed(4)); n.actRect.setAttribute('opacity', k.toFixed(4)); n.idle.setAttribute('opacity', (1 - k).toFixed(4));
    const s = 1 + 0.07 * bump(lt / 0.42);
    n.tile.setAttribute('transform', `translate(${X(i)} ${Y(i)}) scale(${s.toFixed(4)}) translate(${-X(i)} ${-Y(i)})`);
    // icon bật: nảy từ 0.7 lên 1
    p.pop.setAttribute('transform', `translate(60 60) scale(${(0.7 + 0.3 * back((lt - 0.02) / 0.3)).toFixed(4)}) translate(-60 -60)`);
    // chữ: xám khi chờ, đậm khi bật
    LABS[i].querySelector('.h').style.color = rgb(mix([143, 137, 166], [22, 20, 29], k));
    LABS[i].querySelector('.s').style.color = rgb(mix([168, 162, 190], [95, 88, 125], k));
    PIPS[i].style.transform = `scaleX(${k.toFixed(4)})`;
  }
  // bộ đếm bước: lúc lặp mờ đi rồi về 01
  const shown = Math.max(1, count);
  stp.textContent = `STEP ${String(shown).padStart(2, '0')} / 06`;
  stp.style.opacity = t > HOLD_END ? (1 - bump((t - HOLD_END) / RESET) * 0.85).toFixed(4) : '1';
  // dòng kết quả: hiện sau bước 6, ẩn khi lặp
  const r = eo((t - RES_IN) / 0.3) * fo;
  resEl.style.opacity = r.toFixed(4);
  resEl.style.transform = `translateX(-50%) translateY(${(14 * (1 - eo((t - RES_IN) / 0.3))).toFixed(2)}px)`;
}
window.DURATION = DURATION;
window.seek = seek;
window.STATE = () => ({ active: NODES.map((_, i) => Number(NODES[i].act.getAttribute('opacity'))) });
seek(0);
if (Q.get('play')) { const st = performance.now(); const loop = () => { seek(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
</script>
</body></html>
